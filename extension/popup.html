<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 8px; min-width: 200px; font: menu; }
    #profile { display: flex; flex-direction: column; gap: 6px; }
    button {
      padding: 8px 12px; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 6px;
      text-align: left; font: inherit; cursor: pointer;
    }
    button:disabled { cursor: default; opacity: 0.6; }
    p { margin: 4px; }
  </style>
</head>
<body>
  <div id="profile"><p data-i18n="popupLoading"></p></div>
  <script src="popup.js"></script>
</body>
</html>
